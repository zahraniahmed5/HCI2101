<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة إكس أو - HCI Lab 2</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; margin: 50px auto; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .cell { background: #ddd; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; border-radius: 8px; font-weight: bold;}
        .cell.x { color: blue; } .cell.o { color: red; }
        button { padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        footer { margin-top: 30px; font-size: 14px; color: #333; }
        #status { color: #333; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>لعبة X O</h1>
        <h2 id="status">اللاعب X يبدأ</h2>
        <div class="board" id="board"></div>
        <button onclick="resetGame()">لعبة جديدة</button>
        
        <footer>
            <hr>
            <p><strong>Student Name:</strong> AHMED HASSAN MOHAMMED ALZAHRANI (أحمد حسن محمد الزهراني)</p>
            <p><strong>Student ID:</strong> 446005483</p>
            <p><strong>Supervised by:</strong> Mohammed Ahmed Jabali</p>
        </footer>
    </div>

    <script>
        const board = document.getElementById('board');
        let cells = Array(9).fill(null);
        let current = 'X';
        let gameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // صفوف
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // أعمدة
            [0, 4, 8], [2, 4, 6]             // أقطار
        ];
        
        function init() {
            board.innerHTML = '';
            cells.forEach((_, i) => {
                const div = document.createElement('div');
                div.className = 'cell';
                div.onclick = () => move(i);
                board.appendChild(div);
            });
        }

        function move(i) {
            if (!cells[i] && gameActive) {
                cells[i] = current;
                render();
                checkWinner();
                if (gameActive) {
                    current = current === 'X' ? 'O' : 'X';
                    document.getElementById('status').innerText = `دور اللاعب: ${current}`;
                }
            }
        }

        function checkWinner() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                document.getElementById('status').innerText = `مبروك! الفائز هو ${current}`;
                document.getElementById('status').style.color = "green";
                gameActive = false;
                return;
            }

            if (!cells.includes(null)) {
                document.getElementById('status').innerText = "تعادل!";
                gameActive = false;
                return;
            }
        }

        function render() {
            document.querySelectorAll('.cell').forEach((div, i) => {
                div.innerText = cells[i] || '';
                div.className = 'cell'; // reset class
                if(cells[i]) div.classList.add(cells[i].toLowerCase());
            });
        }

        function resetGame() {
            cells = Array(9).fill(null);
            current = 'X';
            gameActive = true;
            document.getElementById('status').innerText = `اللاعب X يبدأ`;
            document.getElementById('status').style.color = "#333";
            render();
        }
        init();
    </script>
</body>
</html>
